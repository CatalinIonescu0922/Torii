version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: '%(asctime)s.%(msecs)03d | %(name)-30s | %(levelname)-8s | %(funcName)-20s:%(lineno)-4d | %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  simple:
    format: '%(asctime)s | %(levelname)-8s | %(name)s | %(message)s'
    datefmt: '%H:%M:%S'
  
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(funcName)s %(lineno)d %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  
  server-debug:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ephemeral/logs/server-debug.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

  extra-debug:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ephemeral/log/extra-debug.log
    encoding: utf8

loggers:
  torri:
    level: DEBUG
    handlers: [server-debug]
    propagate: false
  torri-extra:
    level: DEBUG
    handlers: [extra-debug]
    propagate: false
  confluent_kafka:
    level: WARNING
    handlers: [console, server-debug]
    propagate: false
  
  kafka:
    level: WARNING
    handlers: [console, server-debug]
    propagate: false
  
  pydantic:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: DEBUG
  handlers: [console, server-debug]
