# Torri CI/CD Scheduler Configuration
# Main configuration file for all Torri services

[statsd]
# StatsD metrics collection (disabled if not set)
# server=127.0.0.1
# port=8125

[scheduler]
# Scheduler service configuration
config_dir=layout
pipelines_file=pipelines.yaml
projects_file=projects.yaml
jobs_file=jobs.yaml

# Scheduler queue settings
queue_max_size=1000
queue_timeout_seconds=300

# State storage
redis_url=redis://redis:6379/0

[merger]
# Merger service configuration
git_dir=/tmp/torri/merger-git
git_user_email=torri@example.com
git_user_name=Torri CI
base_url=http://merger:8080

# Connect to Kafka for job requests/responses
kafka_bootstrap_servers=localhost:9092
kafka_group_id=merger
kafka_topic_requests=merger-requests
kafka_topic_responses=merger-responses

[connection gerrit]
# Gerrit Code Review Server
driver=gerrit
server=gerrit
user=torii
password=19D9aIn7zePb
sshkey=/root/.ssh/Torri_ed25519
ssh_port=29418

# Gerrit connection via REST API
base_url=http://gerrit:8080/g
gerrit_rest_port=8080
gerrit_rest_https=false

# Kafka integration for Gerrit events
kafka_bootstrap_servers=localhost:9092
kafka_group_id=gerrit-events
kafka_topic=gerrit-events

[connection kafka]
# Kafka cluster configuration
bootstrap_servers=kafka:9094

# Topic names for inter-service communication
topic_merger_requests=merger-requests
topic_merger_responses=merger-responses
topic_scheduler_events=scheduler-events
topic_gerrit_events=gerrit-events
topic_job_requests=job-requests
topic_job_results=job-results

# Consumer groups
group_scheduler=scheduler
group_merger=merger
group_monitor=monitor

# Producer settings
compression_type=gzip
acks=all
retries=3

[connection redis]
# Redis for state storage and caching
host=redis
port=6379
db=0
password=
ssl=false

[connection database]
# PostgreSQL database for persistent storage
driver=postgresql
host=localhost
port=5432
database=torri
user=torri
password=secret_password
connection_timeout=30

[web]
# Web UI configuration
enabled=true
host=0.0.0.0
port=8000
root_url=http://localhost:8000

[executor]
# Job executor configuration
git_dir=/tmp/torri/executor-git
max_concurrent_jobs=10
job_timeout_seconds=3600
log_dir=/var/log/torri

[logging]
# Logging configuration
level=INFO
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
file=/var/log/torri/scheduler.log
max_bytes=10485760
backup_count=5

[monitoring]
# Metrics and monitoring
statsd_enabled=false
statsd_host=127.0.0.1
statsd_port=8125
metrics_prefix=torri

prometheus_enabled=true
prometheus_port=9090
