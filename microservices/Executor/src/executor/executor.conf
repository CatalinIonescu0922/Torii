# Executor configuration file

[kafka]
bootstrap_servers = kafka:9092
group_id = executor-group
job_requests_topic = job-requests
job_results_topic = job-results

[redis]
url = redis://redis:6379/0

[merger]
# Merger SSH Git server configuration
host = merger
port = 22
ssh_key = /root/.ssh/Torri_ed25519
user = git

[executor]
job_dir = /var/torii/jobs
max_workers = 4
# Set to false to skip bwrap sandboxing (useful if user namespaces are disabled).
use_bwrap = true
nodes_config = /etc/torri/nodes.yaml

# Map node labels to Docker images.
# The executor uses these when a nodeset node has a label that does not match
# any SSH node in the pool — meaning it should run in a container.
[images]
python-slim = python:3.12-slim
debian-bookworm = debian:bookworm-slim
