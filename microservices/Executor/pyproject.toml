[project]
name = "executor"
version = "0.1.0"
description = "Torii job executor — runs Ansible playbooks in bwrap sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.13.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.3",
    "ansible>=9.0.0",
]

[project.scripts]
torri-executor = "executor.cmd.executor:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
