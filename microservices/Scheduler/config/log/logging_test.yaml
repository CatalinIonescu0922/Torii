version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: '%(levelname)-8s | %(name)s | %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: WARNING
    formatter: simple
    stream: ext://sys.stdout
  
  file_test:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: logs/test.log
    mode: w
    encoding: utf8

loggers:
  EventsConsumer:
    level: WARNING
    handlers: [console, file_test]
    propagate: false

root:
  level: WARNING
  handlers: [console]
