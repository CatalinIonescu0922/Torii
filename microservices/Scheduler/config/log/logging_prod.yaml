version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: '%(asctime)s | %(name)-30s | %(levelname)-8s | %(funcName)-20s:%(lineno)-4d | %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  simple:
    format: '%(asctime)s | %(levelname)-8s | %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(funcName)s %(lineno)d %(message)s %(event_type)s %(correlation_id)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  
  file_main:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/events_consumer.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf8
  
  file_json:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/events_consumer_json.log
    when: midnight
    interval: 1
    backupCount: 7
    encoding: utf8

loggers:
  EventsConsumer:
    level: INFO
    handlers: [console, file_main, file_json]
    propagate: false
  
  confluent_kafka:
    level: ERROR
    handlers: [file_main]
    propagate: false
  
  kafka:
    level: ERROR
    handlers: [file_main]
    propagate: false
  
  pydantic:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console, file_main]
