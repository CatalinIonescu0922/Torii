
services:
  gerrit:
    pull_policy: build
    build:
      dockerfile_inline: | 
        FROM gerritcodereview/gerrit:${GERRIT_VERSION}
        COPY --link --chown=1000:1000 --from=gerrit_config /etc/ /var/gerrit/etc/
        COPY --link --chown=1000:1000 --from=gerrit_config  --chmod=600 /ssh/ /var/gerrit/.ssh/
      additional_contexts:
        gerrit_config : files/gerrit/
    networks:
      - torri

  gerrit-config:
    pull_policy : build
    build : 
      dockerfile_inline: |
        FROM mikefarah/yq:${YQ_TAG:?}
        USER root
        RUN apk add --no-cache openssh-client bash curl findutils git docker-cli
        RUN rm -rf /root/.ssh && mkdir --mode=700 /root/.ssh
        COPY --link --chmod=600 --from=ssh_files / /root/.ssh/
        COPY --link --from=layout_file / /root/
      additional_contexts:
        ssh_files : files/ssh/
        layout_file : files/torri/
    container_name: gerrit-config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gerrit:
        condition: service_healthy
    networks:
      - torri

  nginx:
    image: nginx:alpine
    container_name: nginx
