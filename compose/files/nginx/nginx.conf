events {}
http { 
    sendfile on;
    upstream gerrit_up { server gerrit:8080; }
    upstream kafka_ui { server kafka-ui:8080; }
    upstream status_api { server torii_scheduler:8000; }
    upstream torii_ui { server web:80; }
    # upstream jenkins_up {server jenkins:8080; }

    server {
        listen  8087;
        server_name _;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /g {
            proxy_pass http://gerrit_up;
            proxy_set_header Authorization "Basic dG9yaWk6MTlEOWFJbjd6ZVBi";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for Gerrit's live updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Enhanced timeouts & error handling for slow startup
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Retry logic: retry upstream on connection errors, timeouts, and 5xx errors
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 30s;
            
            # Buffering for large responses
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 24 4k;
        }
        location /k {
            proxy_pass http://kafka_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api {
            proxy_pass http://status_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /t/ {
            proxy_pass http://torii_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # WebSocket endpoint for streaming job logs.
        location /ws {
            proxy_pass http://status_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
        }
        # Catch-all for Gerrit assets (fonts, styles, changes, etc.)
        # location / {
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-User $my_user;
        #     proxy_set_header X-Forwarded-Email $my_user@example.com;
        #     proxy_pass http://gerrit_up;
        # }
        
        # location /j/ {
        #     proxy_pass http://jenkins_up/;
        # }
        # location /t/ {
        #     proxy_pass http://torii_up/;
        # }
    }
