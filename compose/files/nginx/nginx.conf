events {}
http { 
    sendfile on;
    upstream gerrit_up { server gerrit:8080; }
    # upstream jenkins_up {server jenkins:8080; }
    # upstream torri_up {server torii:3000; };

    server {
        listen  8087;
        server_name _;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /g {
            proxy_pass http://gerrit_up;
            proxy_set_header Authorization "Basic dG9yaWk6MTlEOWFJbjd6ZVBi";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for Gerrit's live updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for long-running requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Catch-all for Gerrit assets (fonts, styles, changes, etc.)
        # location / {
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-User $my_user;
        #     proxy_set_header X-Forwarded-Email $my_user@example.com;
        #     proxy_pass http://gerrit_up;
        # }
        
        # location /j/ {
        #     proxy_pass http://jenkins_up/;
        # }
        # location /t/ {
        #     proxy_pass http://torri_up/;
        # }
    }
}
