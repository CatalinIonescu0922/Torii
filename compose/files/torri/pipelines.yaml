# Pipeline Definitions
# Simple test pipelines for demo/development

pipelines:
  # Basic verification pipeline
  - pipeline:
      name: check
      manager: independent
      trigger:
        my_gerrit:
          - event: patchset-created
      success:
        my_gerrit:
          Verified: 1
      failure:
        my_gerrit:
          Verified: -1

  - pipeline:
      name: gate
      manager: dependent
      trigger:
        my_gerrit:
          - event: patchset-created
      success:
        my_gerrit:
          Verified: 1
      failure:
        my_gerrit:
          Verified: -1  

  - pipeline:
      name: post
      manager: independent
      trigger:
        my_gerrit:
          - event: patchset-created
      success:
        my_gerrit:
          Verified: 1
      failure:
        my_gerrit:
          Verified: -1