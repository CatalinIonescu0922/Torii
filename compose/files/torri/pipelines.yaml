# Pipeline Definitions
# Simple test pipelines for demo/development

pipelines:
  # Basic verification pipeline
  - pipeline:
      name: check
      manager: independent
      start-message: "[Torii] Starting check jobs"
      failure-message: "[Torii] Check failed"
      success-message: "Check succeeded"

      require:
        open: true
        current-patchset: true
      reject:
        approval:
          - integrated: [-2, -1]

      trigger:
        gerrit:
          - event: patchset-created
          - event: comment-added
            comment: 
              - recheck
      start:
        gerrit:
          - Verified: 0
      success:
        gerrit:
          - Verified: 1
      failure:
        gerrit:
          - Verified: -1

  - pipeline:
      name: gate
      start-message: "[Torii] Starting gate jobs"
      failure-message: "[Torii] Gate failed"
      success-message: "Gate succeeded"
      manager: dependent
      require:
        open: true
        current-patchset: true
        approval:
          - code-review: 2
          - verified: 1

      trigger:
        gerrit:
          - event: comment-added
            comment:
              - ^Patch Set \d+:[^\n]* (?i:code-review|verified)
              - ^[^\n]+\n\s+(?i:regate) 

      start:
        gerrit:
          - Gatekeeper: 0
      success:
        gerrit:
          - Gatekeeper: 1
      failure:
        gerrit:
          - Gatekeeper: -1  
