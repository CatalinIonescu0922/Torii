---
# run.yaml — main job phase, runs after pre.yaml has copied the source into /src.
#
# By this point the merged checkout is already at /src inside the runner container.
# We print every regular file (excluding .git and the injected playbooks subtree)
# as proof that the merger → executor → container pipeline is working end to end.

- name: Print merged source files from runner
  hosts: all
  gather_facts: no
  vars:
    container_src: /src
  tasks:
    - name: Print each source file
      shell: |
        set -eu
        find "{{ container_src }}" \
          -type f \
          ! -path "{{ container_src }}/.git/*" \
          ! -path "{{ container_src }}/playbooks/*" \
          -print | sort | while IFS= read -r f; do
            rel="${f#{{ container_src }}/}"
            echo "----- BEGIN ${rel} -----"
            cat "${f}"
            echo "----- END ${rel} -----"
          done
