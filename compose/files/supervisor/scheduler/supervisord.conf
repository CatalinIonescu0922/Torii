[supervisord]
nodaemon=true
user=root
logfile=/app/ephemeral/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:torri-scheduler]
command=/opt/venv/bin/torri-scheduler -d
directory=/app
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
