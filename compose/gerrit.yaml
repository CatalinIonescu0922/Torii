services:
  gerrit:
    extends: 
      file: build.yaml
      service: gerrit
    container_name: gerrit
    environment:
      CANONICAL_WEB_URL: http://gerrit:8080/g/
      HTTPD_LISTEN_URL: proxy-http://*:8080/g/
      GERRIT_CONFIG_PLUGIN_EVENTS_KAFKA_SENDSTREAMEVENTS: "true"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - gerrit_git:/var/gerrit/git
      - gerrit_index:/var/gerrit/index
      - gerrit_cache:/var/gerrit/cache
      - gerrit_plugins:/var/gerrit/plugins
      # - ./files/gerrit/etc/gerrit.config:/var/gerrit/etc/gerrit.config:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -svf --noproxy '*' http://${GERRIT_USER:?}@localhost:8080/g/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 70s


  gerrit-config:
    extends: 
      file: build.yaml
      service: gerrit-config
    working_dir: /root
    entrypoint: ["bash", "-c"] 
    depends_on:
      gerrit:
        condition: service_healthy
    command: 
      - | 
        set -uoe pipefail -x
        gerrit=(docker exec -u root -i gerrit ssh -F /var/gerrit/.ssh/config self suexec --as ${GERRIT_USER:?} -- gerrit)
        ls-projects() (yq '.projects[] | .name' /root/projects.yaml | grep -vF ^ | sed '/^---$/d')
        "$${gerrit[@]}" set-account --add-email ${GERRIT_USER:?}@localdomain \
                                    --http-password ${GERRIT_PASSWORD:?} \
                                    --add-ssh-key - self < /root/.ssh/authorized_keys
        comm -13 <("$${gerrit[@]}" ls-groups | sort) - <<< ${GERRIT_GROUP:?} |
            xargs -trn1 "$${gerrit[@]}" create-group --member self
        comm -13 <("$${gerrit[@]}" ls-projects | sort) - <<< ${GERRIT_PERMISSIONS_REPO:?} |
            xargs -trn1 "$${gerrit[@]}" create-project --owner ${GERRIT_GROUP:?} --permissions-only
        comm -13 <("$${gerrit[@]}" ls-projects | sort) <(ls-projects | sort) |
            xargs -trn1 "$${gerrit[@]}" create-project --owner ${GERRIT_GROUP:?} --parent ${GERRIT_PERMISSIONS_REPO:?} --empty-commit
        cd "$$(mktemp -d || :)"
        git clone ssh://gerrit/${GERRIT_PERMISSIONS_REPO:?} .
        git config user.name ${GERRIT_USER:?}
        git config user.email ${GERRIT_USER:?}@localdomain

        git config -f project.config submit.action 'rebase if necessary'
        git config -f project.config --remove-section access.refs/heads/* || :

        

        add-label() (git config -f project.config --add access.refs/heads/*.label-"$${1}" "$${2} group ${GERRIT_GROUP:?}")
        declare -A labels
        labels=(${GERRIT_LABELS:?})
        # TODO: unify this and what's done in All-Projects/project.config
        for label in "$${!labels[@]}"; do add-label "$${label}" "$${labels[$${label}]}"; done
        cat project.config
        ! git commit -am "update label perms" || git push origin HEAD:refs/meta/config
        # gerrit overrides the values of the events-kafka properties so i need to set them here 
        docker exec -u gerrit gerrit \
        git config -f /var/gerrit/etc/gerrit.config plugin.events-kafka.sendStreamEvents true
        "$${gerrit[@]}" plugin reload events-kafka
        # we need to perform a gerrit restart because a simple plugin reload is not enought 
        docker restart gerrit
volumes:
  gerrit_etc:
  gerrit_git:
  gerrit_index:
  gerrit_cache:
  gerrit_plugins:
