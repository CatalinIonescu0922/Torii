services:
  nginx:
    extends:
      file: build.yaml
      service: nginx
    volumes: 
      - ./files/nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    ports:
      - "8087:8087"
    healthcheck:
      test : ["CMD-SHELL" , "curl -f http://localhost:8087/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 70s

    networks:
      - torri
    depends_on:
      gerrit:
        condition: service_healthy
